<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DimacoLed — Pantallas LED Profesionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e8000a;--red2:#ff2820}
html,body{background:#070707;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
  background: #070707;
  padding-top: clamp(16px, 3vw, 32px);
  padding-bottom: clamp(24px, 4vw, 48px);
}

/* Viñeta central — deja los bordes oscuros */
.hero::before {
  content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
  background: radial-gradient(ellipse 75% 70% at 50% 40%, transparent 25%, rgba(4,2,2,0.78) 100%);
}

/* Scanlines sutiles */
.hero::after {
  content:''; position:absolute; inset:0; z-index:4; pointer-events:none;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px);
}

#bgCanvas  { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
#ledCanvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; }

@media(max-width:600px){ #ledCanvas { opacity: 0.4; } }

/* ══ SCREEN ASSEMBLY ══ */
.screen-assembly {
  position: relative; z-index: 12;
  display: flex; flex-direction: column; align-items: center;
  width: min(660px, 92vw); flex-shrink: 0;
}
.mount-rail {
  width: 100%; height: 5px;
  background: linear-gradient(180deg,#2e2e2e,#111 60%,#0a0a0a);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; justify-content: space-between; align-items: flex-end; padding: 0 7%;
}
.rail-bolt { width:8px; height:5px; background:radial-gradient(circle at 40% 30%,#666,#1a1a1a); border-radius:2px 2px 0 0; }
.cables-row { width:86%; display:flex; justify-content:space-between; height:clamp(10px,2.5vw,20px); }
.cable { width:2px; background:linear-gradient(180deg,#3a3a3a,#1a1a1a); }
.cable.main { width:3px; background:linear-gradient(180deg,#484848,#222); }
.screen-body {
  width: 100%; background: #050506;
  border: 3px solid #161616; border-top: 4px solid #252525; border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.9), 0 0 0 2px rgba(232,0,10,0.07), 0 14px 55px rgba(0,0,0,0.85), inset 0 0 30px rgba(0,0,0,0.5);
  position: relative; overflow: hidden;
}
.screen-body::after {
  content:''; position:absolute; inset:0; z-index:20; pointer-events:none;
  background: repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.16) 1px,rgba(0,0,0,0.16) 2px);
}
.screen-glass { position:absolute; top:0; left:0; right:0; height:35%; z-index:19; pointer-events:none; background:linear-gradient(180deg,rgba(255,255,255,0.03) 0%,transparent 100%); }
.screw { position:absolute; width:8px; height:8px; border-radius:50%; z-index:21; background:radial-gradient(circle at 35% 35%,#555,#111); border:1px solid #2a2a2a; box-shadow:inset 0 1px 2px rgba(255,255,255,0.1); }
.screw::before,.screw::after{content:'';position:absolute;background:rgba(0,0,0,0.5);top:50%;left:50%;transform:translate(-50%,-50%)}
.screw::before{width:5px;height:1px} .screw::after{width:1px;height:5px}
.screw.tl{top:5px;left:5px} .screw.tr{top:5px;right:5px} .screw.bl{bottom:5px;left:5px} .screw.br{bottom:5px;right:5px}
.vent{position:absolute;top:50%;transform:translateY(-50%);width:4px;height:38%;z-index:21;display:flex;flex-direction:column;gap:3px;padding:2px 0}
.vent.left{left:13px} .vent.right{right:13px}
.vent-slot{flex:1;background:rgba(0,0,0,0.55);border-radius:1px;border:.5px solid rgba(255,255,255,0.04)}
.status-led{position:absolute;bottom:7px;right:14px;z-index:22;display:flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:sPulse 2.2s ease-in-out infinite}
@keyframes sPulse{0%,100%{opacity:1}47%,53%{opacity:0.2}}
.status-txt{font-family:'DM Sans',sans-serif;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:rgba(232,0,10,0.55)}
.model-tag{position:absolute;bottom:7px;left:14px;z-index:22;font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.1)}
#screenCanvas { display:block; width:100%; }

/* ══ CONTENIDO ══ */
.content {
  position: relative; z-index: 10; text-align: center;
  padding: clamp(18px,4vw,28px) clamp(16px,5vw,32px) 0;
  max-width: 820px; width: 100%;
  animation: fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) both; animation-delay: 0.5s;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

.eyebrow {
  display:inline-flex; align-items:center; gap:10px; margin-bottom:clamp(12px,2.5vw,20px);
  font-family:'DM Sans',sans-serif; font-size:clamp(0.48rem,1.3vw,0.6rem); font-weight:500;
  letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,0.28);
}
.eyebrow-rule{width:20px;height:1px;background:var(--red);box-shadow:0 0 7px var(--red)}

.brand {
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size: clamp(2.2rem, 10vw, 6.5rem);
  line-height:1; letter-spacing:0.04em; color:#fff; display:inline-block;
}
.brand .letter{display:inline-block;color:rgba(255,255,255,0.07);text-shadow:none}
.brand .letter.accent{color:rgba(232,0,10,0.1)}
.brand .letter.flash{animation:ledFlash .22s forwards}
.brand .letter.accent.flash{animation:ledFlashRed .22s forwards}
.brand .letter.on{color:#fff;text-shadow:0 0 12px rgba(232,0,10,0.5),0 0 30px rgba(232,0,10,0.2)}
.brand .letter.accent.on{color:var(--red2);text-shadow:0 0 14px rgba(255,40,20,0.85),0 0 36px rgba(255,20,10,0.4)}
@keyframes ledFlash{0%{color:rgba(255,255,255,0.07);text-shadow:none}18%{color:#fff;text-shadow:0 0 60px #fff,0 0 100px rgba(232,0,10,0.7)}38%{color:rgba(255,255,255,0.25);text-shadow:none}55%{color:#fff;text-shadow:0 0 30px rgba(232,0,10,0.6)}100%{color:#fff;text-shadow:0 0 12px rgba(232,0,10,0.5),0 0 30px rgba(232,0,10,0.2)}}
@keyframes ledFlashRed{0%{color:rgba(232,0,10,0.1);text-shadow:none}18%{color:#fff;text-shadow:0 0 60px #fff,0 0 100px rgba(255,40,20,0.9)}38%{color:rgba(255,40,20,0.3);text-shadow:none}55%{color:var(--red2);text-shadow:0 0 30px rgba(255,40,20,0.9)}100%{color:var(--red2);text-shadow:0 0 14px rgba(255,40,20,0.85),0 0 36px rgba(255,20,10,0.4)}}
.brand-cursor{display:inline-block;width:.1em;height:.72em;background:var(--red);margin-left:.06em;vertical-align:middle;opacity:0;box-shadow:0 0 10px var(--red);animation:cBlink .9s 2.8s step-end infinite}
@keyframes cBlink{0%,100%{opacity:0}50%{opacity:1}}

.mark-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:clamp(10px,2vw,15px) 0}
.mark-line{flex:1;max-width:60px;height:1px;background:rgba(255,255,255,0.08)}
.mark-diamond{width:5px;height:5px;border:1.5px solid var(--red);transform:rotate(45deg);box-shadow:0 0 8px rgba(232,0,10,0.5)}
.mark-sub{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(0.5rem,1.2vw,0.65rem);letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,0.24)}

.tagline{
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:clamp(0.78rem,2.2vw,1.08rem);
  color:rgba(255,255,255,0.46);line-height:1.75;
  max-width:420px;margin:0 auto;
}

.corner{position:absolute;top:26px;right:20px;z-index:15;text-align:right;font-family:'DM Sans',sans-serif}
.corner-top{font-size:0.52rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.15);margin-bottom:3px}
.corner-bot{font-size:0.63rem;font-weight:500;letter-spacing:1px;color:rgba(255,255,255,0.32)}
@media(max-width:480px){ .corner{ display:none; } }

.footer-line{
  position:absolute;bottom:0;left:0;right:0;height:1px;z-index:15;
  background:linear-gradient(90deg,transparent 0%,rgba(232,0,10,0.4) 30%,rgba(255,255,255,0.08) 50%,rgba(232,0,10,0.4) 70%,transparent 100%);
}
</style>
</head>
<body>
<section class="hero">
  <canvas id="bgCanvas"></canvas>
  <canvas id="ledCanvas"></canvas>

  <div class="screen-assembly" id="screenAssembly">
    <div class="mount-rail">
      <div class="rail-bolt"></div><div class="rail-bolt"></div><div class="rail-bolt"></div><div class="rail-bolt"></div><div class="rail-bolt"></div>
    </div>
    <div class="cables-row">
      <div class="cable main"></div><div class="cable"></div><div class="cable"></div><div class="cable main"></div>
    </div>
    <div class="screen-body" id="screenBody">
      <div class="screen-glass"></div>
      <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>
      <div class="vent left"><div class="vent-slot"></div><div class="vent-slot"></div><div class="vent-slot"></div><div class="vent-slot"></div></div>
      <div class="vent right"><div class="vent-slot"></div><div class="vent-slot"></div><div class="vent-slot"></div><div class="vent-slot"></div></div>
      <div class="status-led"><div class="status-dot"></div><span class="status-txt">ON · LIVE</span></div>
      <div class="model-tag">DMC-P2.5-HD</div>
      <canvas id="screenCanvas"></canvas>
    </div>
  </div>

  <div class="content">
    <div class="eyebrow"><span class="eyebrow-rule"></span>Fabricantes de Pantallas LED<span class="eyebrow-rule"></span></div>
    <div style="position:relative;display:inline-block;">
      <h1 class="brand" id="brandTitle"></h1>
      <span class="brand-cursor"></span>
    </div>
    <div class="mark-row">
      <div class="mark-line"></div><div class="mark-diamond"></div>
      <p class="mark-sub">Visual Excellence</p>
      <div class="mark-diamond"></div><div class="mark-line"></div>
    </div>
    <p class="tagline">Diseño, fabricación e instalación de pantallas LED<br>para cualquier entorno y aplicación.</p>
  </div>

  <div class="corner"><div class="corner-top">Est. 2008</div><div class="corner-bot">Madrid, España</div></div>
  <div class="footer-line"></div>
</section>

<script>
/* ══ TÍTULO ══ */
(function(){
  const text='DimacoLed',acc=new Set([0,7]),el=document.getElementById('brandTitle');
  text.split('').forEach((ch,i)=>{
    const s=document.createElement('span');
    s.className='letter'+(acc.has(i)?' accent':'');
    s.textContent=ch; el.appendChild(s);
  });
  [...el.querySelectorAll('.letter')].forEach((s,i)=>{
    setTimeout(()=>s.classList.add('flash'),700+i*110);
    setTimeout(()=>{s.classList.remove('flash');s.classList.add('on');},700+i*110+320);
  });
})();


/* ══════════════════════════════════════════
   FONDO ATMOSFÉRICO — versión profesional
   Capas:
   1. Nebulosas de luz roja muy suaves (larga vida, movimiento mínimo)
   2. Partículas flotantes — puntos de luz pura, sin grid, sin texto
   3. Filamentos de energía — líneas muy finas con fade suave
   4. Ondas de propagación lentas — pulsos casi imperceptibles
══════════════════════════════════════════ */
(function(){
  const cv=document.getElementById('bgCanvas');
  const cx=cv.getContext('2d');
  function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  resize();

  /* ── 1. Nebulosa — manchas de calor difusas ── */
  class Nebula{
    constructor(ini){
      const W=cv.width,H=cv.height;
      // Distribuimos en zonas: bordes y centro-bajo para no tapar el contenido
      const zone=Math.floor(Math.random()*4);
      if(zone===0){this.x=W*(0.0+Math.random()*0.28);this.y=H*(0.1+Math.random()*0.8);}
      else if(zone===1){this.x=W*(0.72+Math.random()*0.28);this.y=H*(0.1+Math.random()*0.8);}
      else if(zone===2){this.x=W*(0.2+Math.random()*0.6);this.y=H*(0.65+Math.random()*0.35);}
      else{this.x=W*(0.1+Math.random()*0.8);this.y=H*(0.0+Math.random()*0.25);}
      this.rx=120+Math.random()*260; this.ry=80+Math.random()*180;
      this.baseA=0.018+Math.random()*0.03;
      this.ph=ini?Math.random()*Math.PI*2:0;
      this.spd=0.00008+Math.random()*0.00015;
      this.vx=(Math.random()-0.5)*0.0025; this.vy=(Math.random()-0.5)*0.0015;
    }
    upd(dt){ this.ph+=this.spd*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; }
    drw(){
      const a=this.baseA*(0.5+0.5*Math.sin(this.ph));
      if(a<0.002) return;
      cx.save(); cx.scale(1, this.ry/this.rx);
      const yS=this.y*(this.rx/this.ry);
      const g=cx.createRadialGradient(this.x,yS,0,this.x,yS,this.rx);
      g.addColorStop(0,   `rgba(200,0,6,${a})`);
      g.addColorStop(0.4, `rgba(140,0,4,${a*0.45})`);
      g.addColorStop(0.75,`rgba(60,0,2,${a*0.1})`);
      g.addColorStop(1,   'rgba(0,0,0,0)');
      cx.fillStyle=g; cx.beginPath(); cx.arc(this.x,yS,this.rx,0,Math.PI*2); cx.fill();
      cx.restore();
    }
  }

  /* ── 2. Partícula flotante ── */
  class Particle{
    constructor(ini){
      const W=cv.width,H=cv.height;
      this.x=Math.random()*W; this.y=ini?Math.random()*H:H+4;
      // Velocidad muy lenta — flotación natural
      this.vx=(Math.random()-0.5)*0.012;
      this.vy=-(0.008+Math.random()*0.018);
      // Tamaño mínimo — solo puntos de luz
      this.r=0.4+Math.random()*1.0;
      this.maxA=0.12+Math.random()*0.28;
      this.ph=Math.random()*Math.PI*2;
      this.spd=0.0006+Math.random()*0.001;
      // Ciclo de vida
      this.life=ini?Math.random()*18000:0;
      this.maxL=12000+Math.random()*14000;
      // Tipo: rojo puro (70%), naranja cálido (20%), blanco tenue (10%)
      this.type=Math.random()<0.7?0:Math.random()<0.67?1:2;
    }
    get alpha(){
      const p=this.life/this.maxL;
      const env=p<0.12?(p/0.12):p>0.82?((1-p)/0.18):1;
      return env*this.maxA*(0.55+0.45*Math.sin(this.ph));
    }
    upd(dt){
      this.life+=dt; this.ph+=this.spd*dt;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
      // Deriva horizontal suave
      this.vx+=(Math.random()-0.5)*0.0002;
      this.vx=Math.max(-0.025,Math.min(0.025,this.vx));
      if(this.life>this.maxL||this.y<-6) this.rst();
    }
    rst(){
      const W=cv.width,H=cv.height;
      this.x=Math.random()*W; this.y=H+4;
      this.vx=(Math.random()-0.5)*0.012; this.vy=-(0.008+Math.random()*0.018);
      this.life=0; this.maxL=12000+Math.random()*14000;
      this.ph=Math.random()*Math.PI*2;
    }
    drw(){
      const a=this.alpha; if(a<0.005) return;
      cx.save();
      const col=this.type===0?`rgba(220,10,10,${a})`:this.type===1?`rgba(255,80,20,${a*0.75})`:`rgba(240,200,180,${a*0.5})`;
      cx.fillStyle=col;
      cx.beginPath(); cx.arc(this.x,this.y,this.r,0,Math.PI*2); cx.fill();
      // Halo muy suave para las más brillantes
      if(a>0.18){
        const g=cx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*5);
        g.addColorStop(0,`rgba(200,0,6,${a*0.22})`); g.addColorStop(1,'rgba(0,0,0,0)');
        cx.fillStyle=g; cx.beginPath(); cx.arc(this.x,this.y,this.r*5,0,Math.PI*2); cx.fill();
      }
      cx.restore();
    }
  }

  /* ── 3. Filamento de energía ── */
  class Filament{
    constructor(ini){ this.rst(ini); }
    rst(ini){
      const W=cv.width,H=cv.height;
      // Origen: siempre en los bordes laterales para no cruzar el centro
      const side=Math.random()<0.5;
      this.x0=side?Math.random()*W*0.22:W*(0.78+Math.random()*0.22);
      this.y0=Math.random()*H;
      // Extremo: va hacia el interior pero no demasiado
      const ang=(side?0:-Math.PI)+(Math.random()-0.5)*1.1;
      const len=60+Math.random()*140;
      this.x1=this.x0+Math.cos(ang)*len; this.y1=this.y0+Math.sin(ang)*len;
      this.maxA=0.06+Math.random()*0.09;
      this.life=ini?Math.random()*5000:0;
      this.maxL=3000+Math.random()*5000;
      this.w=0.3+Math.random()*0.5;
    }
    upd(dt){
      this.life+=dt;
      if(this.life>this.maxL) this.rst(false);
    }
    drw(){
      const p=this.life/this.maxL;
      const env=p<0.15?(p/0.15):p>0.7?((1-p)/0.3):1;
      const a=this.maxA*env; if(a<0.004) return;
      const g=cx.createLinearGradient(this.x0,this.y0,this.x1,this.y1);
      g.addColorStop(0,'rgba(200,0,8,0)');
      g.addColorStop(0.35,`rgba(220,0,8,${a})`);
      g.addColorStop(0.65,`rgba(200,0,8,${a*0.7})`);
      g.addColorStop(1,'rgba(200,0,8,0)');
      cx.save(); cx.beginPath(); cx.moveTo(this.x0,this.y0); cx.lineTo(this.x1,this.y1);
      cx.strokeStyle=g; cx.lineWidth=this.w; cx.stroke(); cx.restore();
    }
  }

  /* ── 4. Onda de propagación ── */
  class Wave{
    constructor(){ this.active=false; this.cd=6000+Math.random()*12000; this.newPos(); }
    newPos(){
      const W=cv.width,H=cv.height;
      // Solo en esquinas/bordes
      const edge=Math.floor(Math.random()*4);
      if(edge===0){this.x=W*Math.random()*0.3;this.y=H*Math.random()*0.4;}
      else if(edge===1){this.x=W*(0.7+Math.random()*0.3);this.y=H*Math.random()*0.4;}
      else if(edge===2){this.x=W*Math.random()*0.3;this.y=H*(0.6+Math.random()*0.4);}
      else{this.x=W*(0.7+Math.random()*0.3);this.y=H*(0.6+Math.random()*0.4);}
      this.maxR=90+Math.random()*130;
      this.maxA=0.055+Math.random()*0.06;
    }
    upd(dt){
      this.cd-=dt;
      if(this.cd<=0&&!this.active){this.active=true;this.r=0;}
      if(this.active){
        this.r+=0.032*dt;
        if(this.r>=this.maxR){this.active=false;this.cd=6000+Math.random()*12000;this.newPos();}
      }
    }
    drw(){
      if(!this.active||this.r<=0) return;
      const prog=this.r/this.maxR, a=this.maxA*(1-prog)*(1-prog);
      if(a<0.003) return;
      cx.save();
      cx.beginPath(); cx.arc(this.x,this.y,this.r,0,Math.PI*2);
      cx.strokeStyle=`rgba(210,0,8,${a})`; cx.lineWidth=0.8; cx.stroke();
      cx.restore();
    }
  }

  /* ── 5. Grid de perspectiva — plano técnico tenue ── */
  // Se dibuja una sola vez en un offscreen canvas y se compone encima
  let gridCanvas=null;
  function buildGrid(W,H){
    gridCanvas=document.createElement('canvas');
    gridCanvas.width=W; gridCanvas.height=H;
    const g=gridCanvas.getContext('2d');

    // Grid horizontal — líneas paralelas que convergen en horizonte central
    const LINES=18, hor=H*0.52;
    for(let i=0;i<=LINES;i++){
      const t=i/LINES;
      // Perspectiva: las líneas se comprimen hacia el horizonte
      const ease=Math.pow(t,1.6);
      const y=hor+(H*0.55)*ease;
      if(y>H+2) continue;
      const alpha=0.028*(1-t*0.7);
      g.beginPath(); g.moveTo(0,y); g.lineTo(W,y);
      g.strokeStyle=`rgba(180,0,6,${alpha})`; g.lineWidth=0.5; g.stroke();
    }

    // Grid vertical — líneas que divergen desde punto de fuga central
    const VLINES=22, vx=W*0.5;
    for(let i=0;i<=VLINES;i++){
      const t=i/VLINES; // 0 = centro, 1 = extremo
      const spread=(t-0.5)*2; // -1 a 1
      const xTop=vx+spread*W*0.38;
      const xBot=vx+spread*W*1.1;
      const alpha=0.022*(1-Math.abs(spread)*0.55);
      g.beginPath(); g.moveTo(xTop,hor); g.lineTo(xBot,H+10);
      g.strokeStyle=`rgba(160,0,5,${alpha})`; g.lineWidth=0.4; g.stroke();
    }

    // Línea de horizonte — muy sutil
    g.beginPath(); g.moveTo(0,hor); g.lineTo(W,hor);
    g.strokeStyle='rgba(200,0,8,0.04)'; g.lineWidth=0.6; g.stroke();
  }

  /* ── 6. Viga de luz diagonal ── */
  class Beam{
    constructor(){ this.active=false; this.cd=14000+Math.random()*20000; }
    fire(W,H){
      // Entra desde esquina, muy inclinada, casi rozando el borde
      const fromTop=Math.random()<0.5;
      if(fromTop){
        this.x0=Math.random()<0.5?W*(-0.05):W*1.05;
        this.y0=-10;
        this.x1=this.x0>W*0.5?W*(0.0+Math.random()*0.35):W*(0.65+Math.random()*0.35);
        this.y1=H+10;
      } else {
        this.y0=Math.random()<0.5?-10:H+10;
        this.x0=W*(0.05+Math.random()*0.9);
        this.x1=this.x0+(Math.random()-0.5)*W*0.3;
        this.y1=this.y0>H*0.5?-10:H+10;
      }
      this.w=40+Math.random()*80; // ancho de la viga
      this.maxA=0.022+Math.random()*0.018;
      this.life=0; this.maxL=2200+Math.random()*1800;
    }
    upd(dt,W,H){
      this.cd-=dt;
      if(this.cd<=0&&!this.active){ this.active=true; this.fire(W,H); }
      if(this.active){
        this.life+=dt;
        if(this.life>=this.maxL){ this.active=false; this.cd=14000+Math.random()*20000; }
      }
    }
    drw(W,H){
      if(!this.active) return;
      const p=this.life/this.maxL;
      const env=p<0.2?(p/0.2):p>0.65?((1-p)/0.35):1;
      const a=this.maxA*env; if(a<0.002) return;

      // Vector perpendicular a la dirección del rayo para el ancho
      const dx=this.x1-this.x0, dy=this.y1-this.y0;
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      const nx=-dy/len, ny=dx/len; // perpendicular normalizado
      const hw=this.w*0.5;

      cx.save();
      // Polígono del rayo
      cx.beginPath();
      cx.moveTo(this.x0+nx*hw*0.1, this.y0+ny*hw*0.1);
      cx.lineTo(this.x0-nx*hw*0.1, this.y0-ny*hw*0.1);
      cx.lineTo(this.x1-nx*hw,     this.y1-ny*hw);
      cx.lineTo(this.x1+nx*hw,     this.y1+ny*hw);
      cx.closePath();

      // Gradiente transversal — brillo en el centro, cero en los bordes
      const mx=(this.x0+this.x1)*0.5, my=(this.y0+this.y1)*0.5;
      const gr=cx.createLinearGradient(mx+nx*hw,my+ny*hw, mx-nx*hw,my-ny*hw);
      gr.addColorStop(0,   'rgba(200,0,6,0)');
      gr.addColorStop(0.38,`rgba(210,0,6,${a*0.3})`);
      gr.addColorStop(0.5, `rgba(230,10,6,${a})`);
      gr.addColorStop(0.62,`rgba(210,0,6,${a*0.3})`);
      gr.addColorStop(1,   'rgba(200,0,6,0)');
      cx.fillStyle=gr; cx.fill();
      cx.restore();
    }
  }

  /* ── Escena ── */
  let nebulas=[],particles=[],filaments=[],waves=[],beams=[];

  function build(){
    const W=cv.width,H=cv.height;
    buildGrid(W,H);
    nebulas=Array.from({length:7},(_,i)=>new Nebula(i<7));
    const pc=Math.min(120,Math.floor(W*H/7000));
    particles=Array.from({length:pc},()=>new Particle(true));
    const fc=Math.min(22,Math.floor(W/55));
    filaments=Array.from({length:fc},()=>new Filament(true));
    waves=Array.from({length:4},()=>new Wave());
    beams=[new Beam(), new Beam()];
    // Desfasar los beams
    beams[1].cd+=8000;
  }

  build();
  window.addEventListener('resize',()=>{ resize(); build(); });

  let last=0;
  function loop(ts){
    const dt=Math.min(ts-last,48); last=ts;
    const W=cv.width,H=cv.height;
    cx.fillStyle='rgba(7,7,7,0.14)'; cx.fillRect(0,0,W,H);

    // Grid — siempre en la parte inferior, muy persistente
    if(gridCanvas) cx.drawImage(gridCanvas,0,0);

    nebulas.forEach(n=>{n.upd(dt);n.drw()});
    beams.forEach(b=>{b.upd(dt,W,H);b.drw(W,H)});
    filaments.forEach(f=>{f.upd(dt);f.drw()});
    waves.forEach(w=>{w.upd(dt);w.drw()});
    particles.forEach(p=>{p.upd(dt);p.drw()});
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

class LedStrip{
  constructor(cfg){
    Object.assign(this,{nx:cfg.nx,scale:cfg.scale??1,alpha:cfg.alpha??1,speed:cfg.speed??0.00055,length:cfg.length??0.87,hookDir:cfg.hookDir??1,hookW:cfg.hookW??0.012,state:0,front:cfg.phase??0,pauseMs:0,PAUSE:650+Math.random()*750,N:80,dirty:true,_pts:[],_W:0,_H:0});
  }
  buildPath(W,H){
    if(!this.dirty&&this._W===W&&this._H===H)return this._pts;
    this._W=W;this._H=H;this.dirty=false;
    const x=this.nx*W,yBot=H*(0.04+this.length),hkX=x+this.hookDir*this.hookW*W,hkH=H*0.026;
    const hN=Math.max(3,Math.floor(this.N*.07)),bN=this.N-hN;
    this._pts=[];
    for(let i=0;i<=hN;i++){const t=i/hN,mt=1-t;this._pts.push({x:mt*mt*hkX+2*mt*t*hkX+t*t*x,y:mt*mt*0+2*mt*t*hkH*.08+t*t*hkH,t:t*.07});}
    for(let i=1;i<=bN;i++){const t=i/bN;this._pts.push({x,y:hkH+(yBot-hkH)*t,t:.07+t*.93});}
    return this._pts;
  }
  update(dt){
    const s=this.speed*dt;
    if(this.state===0){this.front+=s;if(this.front>=1){this.front=1;this.state=1;this.pauseMs=0;}}
    else if(this.state===1){this.pauseMs+=dt;if(this.pauseMs>=this.PAUSE)this.state=2;}
    else{this.front-=s*1.25;if(this.front<=0){this.front=0;this.state=0;}}
  }

    const pts=this.buildPath(W,H),N=pts.length-1,fr=this.front,ba=this.alpha,lit=t=>this.state===1||t<=fr;
    ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<=N;i++)ctx.lineTo(pts[i].x,pts[i].y);

      const wb=Math.round(I*I*205);
      ctx.save();ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(232,0,10,${ba*I*.17})`;ctx.lineWidth=(11+I*6)*this.scale;ctx.lineCap='round';ctx.shadowColor=`rgba(232,0,10,${I})`;ctx.shadowBlur=18*I;ctx.stroke();ctx.restore();
      ctx.save();ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(232,${wb},${wb},${ba*(.52+I*.44)})`;ctx.lineWidth=2.2*this.scale;ctx.lineCap='round';ctx.stroke();ctx.restore();
      if(I>.28){ctx.save();ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(255,255,255,${ba*I*.22})`;ctx.lineWidth=.8*this.scale;ctx.lineCap='round';ctx.stroke();ctx.restore();}
    }
    if(this.state!==1){
      const fp=pts[Math.min(Math.floor(fr*N),N)],p=.72+.28*Math.sin(Date.now()*.013);
      const gr=ctx.createRadialGradient(fp.x,fp.y,0,fp.x,fp.y,38*this.scale);
      gr.addColorStop(0,`rgba(255,255,255,${.68*ba*p})`);gr.addColorStop(.15,`rgba(255,130,110,${.42*ba*p})`);gr.addColorStop(.4,`rgba(232,0,10,${.16*ba*p})`);gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save();ctx.beginPath();ctx.arc(fp.x,fp.y,38*this.scale,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();ctx.restore();

    }

  if(tiny){defs=[{nx:SL*.05,hookDir:-1,hookW:.02,length:.82,scale:.65,alpha:.45,speed:.00058,phase:.10},{nx:SR+(1-SR)*.95,hookDir:1,hookW:.02,length:.82,scale:.65,alpha:.45,speed:.00058,phase:.60}];}
  else if(mob){defs=[{nx:SL*.08,hookDir:-1,hookW:.018,length:.85,scale:.80,alpha:.60,speed:.00052,phase:.00},{nx:SL*.40,hookDir:1,hookW:.010,length:.70,scale:.55,alpha:.28,speed:.00070,phase:.55},{nx:SR+(1-SR)*.60,hookDir:-1,hookW:.010,length:.70,scale:.55,alpha:.28,speed:.00070,phase:.30},{nx:SR+(1-SR)*.92,hookDir:1,hookW:.018,length:.85,scale:.80,alpha:.60,speed:.00052,phase:.50}];}
  else{defs=[{nx:SL*.10,hookDir:-1,hookW:.016,length:.89,scale:1.05,alpha:.93,speed:.00050,phase:.00},{nx:SL*.26,hookDir:1,hookW:.010,length:.79,scale:.89,alpha:.71,speed:.00063,phase:.40},{nx:SL*.45,hookDir:-1,hookW:.011,length:.91,scale:.99,alpha:.85,speed:.00054,phase:.68},{nx:SL*.63,hookDir:1,hookW:.008,length:.73,scale:.73,alpha:.50,speed:.00075,phase:.18},{nx:SL*.80,hookDir:-1,hookW:.007,length:.64,scale:.60,alpha:.32,speed:.00083,phase:.85},{nx:SL*.93,hookDir:1,hookW:.006,length:.55,scale:.46,alpha:.18,speed:.00092,phase:.55},{nx:SR+(1-SR)*.07,hookDir:1,hookW:.016,length:.89,scale:1.05,alpha:.93,speed:.00050,phase:.50},{nx:SR+(1-SR)*.22,hookDir:-1,hookW:.010,length:.79,scale:.89,alpha:.71,speed:.00063,phase:.20},{nx:SR+(1-SR)*.40,hookDir:1,hookW:.011,length:.91,scale:.99,alpha:.85,speed:.00054,phase:.62},{nx:SR+(1-SR)*.58,hookDir:-1,hookW:.008,length:.73,scale:.73,alpha:.50,speed:.00075,phase:.76},{nx:SR+(1-SR)*.76,hookDir:1,hookW:.007,length:.64,scale:.60,alpha:.32,speed:.00083,phase:.33},{nx:SR+(1-SR)*.91,hookDir:-1,hookW:.006,length:.55,scale:.46,alpha:.18,speed:.00092,phase:.70}];}
  strips=defs.map(c=>new LedStrip(c));
}

class Dust{
  constructor(r){this.init(r??true)}
  init(r){
    const W=canvas.width,H=canvas.height;
    const side=Math.random()<.5,zL=screenLeft>0.02?Math.random()*screenLeft:0,zR=screenRight<0.98?screenRight+Math.random()*(1-screenRight):0.99;
    const zone=side?zL:zR;
    this.x=zone*W;this.y=r?Math.random()*H:H+4;
    this.vy=-(0.04+Math.random()*.09);this.vx=(Math.random()-.5)*.025;
    this.r=.3+Math.random()*1.1;this.maxA=.06+Math.random()*.10;
    this.life=r?Math.random()*6000:0;this.maxL=4500+Math.random()*5000;
  }
  get a(){const p=this.life/this.maxL;return p<.15?(p/.15)*this.maxA:p>.8?((1-p)/.2)*this.maxA:this.maxA}
  update(dt){this.life+=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.life>this.maxL||this.y<-4)this.init(false)}
  draw(){ctx.save();ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,50,50,${this.a})`;ctx.fill();ctx.restore()}
}
const dustCount=window.innerWidth<600?12:40;
const dust=Array.from({length:dustCount},()=>new Dust(true));

setTimeout(resizeLed,200);
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(resizeLed,80);});

let lastLedT=0;
function ledLoop(ts){
  const dt=Math.min(ts-lastLedT,48);lastLedT=ts;
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  dust.forEach(d=>{d.update(dt);d.draw()});
  strips.forEach(s=>{s.update(dt);s.draw(W,H)});
  requestAnimationFrame(ledLoop);
}
requestAnimationFrame(ledLoop);
</script>
